<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>P&A Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root[data-theme="dark"]{
  --bg:#07101f;--panel:#0d1a2e;--panel2:#111f33;--panel3:#152540;
  --border:#1c2e46;--border2:#243858;
  --text:#e8f0fe;--sub:#7a90b0;--sub2:#4a6282;
  --input:#111f33;
  --blue:#2979ff;--teal:#00c9a7;--danger:#ef4444;--warn:#f59e0b;--purple:#8b5cf6;
  --grad:linear-gradient(135deg,#2979ff,#00c9a7);
  --msg-me:linear-gradient(135deg,#2979ff,#1a5fd4);
  --msg-them:#152540;--msg-them-border:#1c2e46;
  --overlay:rgba(7,16,31,.94);
  --sh:0 24px 64px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --bg:#f0f4f8;--panel:#ffffff;--panel2:#f8fafc;--panel3:#f1f5f9;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#0f172a;--sub:#64748b;--sub2:#94a3b8;
  --input:#f8fafc;
  --blue:#2563eb;--teal:#0d9488;--danger:#ef4444;--warn:#d97706;--purple:#7c3aed;
  --grad:linear-gradient(135deg,#2563eb,#0d9488);
  --msg-me:linear-gradient(135deg,#2563eb,#1d4ed8);
  --msg-them:#f1f5f9;--msg-them-border:#e2e8f0;
  --overlay:rgba(15,23,42,.9);
  --sh:0 8px 32px rgba(0,0,0,.1);
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:background .25s,color .25s}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:54px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;z-index:20}
.tb-menu{width:36px;height:36px;border:none;background:transparent;color:var(--sub);border-radius:8px;display:none;place-items:center;cursor:pointer;transition:all .2s;flex-shrink:0}
.tb-menu:hover{background:var(--panel2);color:var(--text)}
.tb-menu svg{width:20px;height:20px}
.tb-logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.tb-logo img{height:28px;object-fit:contain}
.tb-logo-txt{font-size:16px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tb-mid{flex:1}
.tb-uid{display:flex;align-items:center;gap:6px;background:rgba(0,201,167,.08);border:1px solid rgba(0,201,167,.2);border-radius:20px;padding:5px 11px;font-size:11px;font-weight:600;color:var(--teal);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.tb-uid svg{width:13px;height:13px}
.tb-uid:hover{background:rgba(0,201,167,.14)}
.tb-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-user-name{font-size:12px;font-weight:500;color:var(--sub)}
.ib{width:36px;height:36px;border:1px solid var(--border);background:var(--panel2);border-radius:9px;display:grid;place-items:center;color:var(--sub);cursor:pointer;transition:all .2s;flex-shrink:0}
.ib svg{width:17px;height:17px}
.ib:hover{color:var(--text);border-color:var(--border2)}

/* ── LAYOUT ── */
.main{display:flex;flex:1;overflow:hidden;position:relative}

/* ── SIDEBAR OVERLAY (mobile) ── */
.sb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:19;display:none;opacity:0;transition:opacity .25s}
.sb-overlay.show{display:block;opacity:1}

/* ── SIDEBAR ── */
.sidebar{width:275px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:20;transition:transform .25s cubic-bezier(.4,0,.2,1)}

/* Nav tabs */
.nav{display:flex;padding:8px 8px 0;gap:2px;flex-shrink:0}
.nt{flex:1;padding:8px 4px;border:none;background:transparent;color:var(--sub);font-family:'Inter',sans-serif;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:8px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nt svg{width:18px;height:18px}
.nt:hover{background:var(--panel2);color:var(--text)}
.nt.on{background:var(--panel2);color:var(--blue)}
.nbadge{position:absolute;top:3px;right:calc(50% - 18px);min-width:16px;height:16px;background:var(--danger);border-radius:8px;font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center;color:#fff;padding:0 4px}
.nbadge.show{display:flex}

/* Search */
.sb-search{padding:10px 10px 8px;flex-shrink:0}
.srch-wrap{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:0 11px;transition:border .2s}
.srch-wrap:focus-within{border-color:var(--blue)}
.srch-wrap svg{width:15px;height:15px;color:var(--sub);flex-shrink:0}
.srch-inp{flex:1;background:transparent;border:none;padding:9px 0;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none}
.srch-inp::placeholder{color:var(--sub2)}

/* Search results dropdown */
.srch-results{border-bottom:1px solid var(--border);display:none;max-height:240px;overflow-y:auto}

/* List area */
.list{flex:1;overflow-y:auto;padding:4px 6px 10px}
.list::-webkit-scrollbar{width:3px}
.list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* Empty state */
.empty{padding:30px 16px;text-align:center;color:var(--sub);font-size:12px;line-height:1.9}
.empty svg{width:38px;height:38px;margin:0 auto 12px;opacity:.35}

/* User row */
.urow{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .15s;position:relative}
.urow:hover{background:var(--panel2)}
.urow.active{background:var(--panel3);border:1px solid var(--border2)}

/* Avatar */
.av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;background:var(--grad);position:relative;overflow:hidden;user-select:none}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av.sm{width:30px;height:30px;font-size:12px}
.av.lg{width:72px;height:72px;font-size:26px}
.online-dot{position:absolute;bottom:1px;right:1px;width:9px;height:9px;border-radius:50%;background:var(--teal);border:2px solid var(--panel)}

/* User info */
.ui{flex:1;min-width:0}
.ui-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-sub{font-size:11px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Action buttons in list */
.uactions{display:flex;gap:4px;flex-shrink:0}
.ab{width:30px;height:30px;border-radius:8px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;transition:all .15s;color:var(--sub)}
.ab svg{width:15px;height:15px}
.ab:hover{transform:scale(1.1)}
.ab.msg:hover{background:rgba(139,92,246,.12);color:var(--purple)}
.ab.voice:hover{background:rgba(0,201,167,.12);color:var(--teal)}
.ab.video:hover{background:rgba(41,121,255,.12);color:var(--blue)}
.unread-dot{position:absolute;top:10px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--blue)}

/* Request row */
.req-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:rgba(0,201,167,.04);border:1px solid rgba(0,201,167,.1);margin-bottom:5px}
.req-acts{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.rbt{padding:5px 10px;border-radius:7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:all .15s;display:flex;align-items:center;gap:4px}
.rbt svg{width:11px;height:11px}
.rbt-acc{background:rgba(0,201,167,.12);color:var(--teal);border:1px solid rgba(0,201,167,.28)!important}
.rbt-acc:hover{background:rgba(0,201,167,.22)}
.rbt-dec{background:rgba(239,68,68,.08);color:var(--danger);border:1px solid rgba(239,68,68,.2)!important}
.rbt-dec:hover{background:rgba(239,68,68,.16)}

/* Search result rows */
.sr-row{display:flex;align-items:center;gap:9px;padding:8px 12px;transition:background .15s;cursor:default}
.sr-row:hover{background:var(--panel2)}
.sr-info{flex:1;min-width:0}
.sr-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-un{font-size:10px;color:var(--sub)}
.sr-btn{padding:4px 10px;border-radius:7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;transition:all .15s}
.sr-add{background:rgba(0,201,167,.1);color:var(--teal);border:1px solid rgba(0,201,167,.25)!important}
.sr-add:hover{background:rgba(0,201,167,.2)}
.sr-pend{background:var(--panel2);color:var(--sub);border:1px solid var(--border)!important;cursor:default}
.sr-fri{background:rgba(41,121,255,.08);color:var(--blue);border:1px solid rgba(41,121,255,.2)!important;cursor:default}

/* Call history rows */
.ch-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;margin-bottom:3px;transition:background .15s}
.ch-row:hover{background:var(--panel2)}
.ch-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ch-ic svg{width:15px;height:15px}
.ch-out{background:rgba(41,121,255,.1);color:var(--blue)}
.ch-in{background:rgba(0,201,167,.1);color:var(--teal)}
.ch-miss{background:rgba(239,68,68,.1);color:var(--danger)}
.ch-rej{background:rgba(245,158,11,.1);color:var(--warn)}
.ch-info{flex:1;min-width:0}
.ch-peer{font-size:12px;font-weight:500}
.ch-meta{font-size:10px;color:var(--sub)}
.ch-dur{font-size:11px;font-weight:600;color:var(--sub);flex-shrink:0}

/* ── CONTENT ── */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* Missed banner */
.missed-banner{display:none;align-items:center;gap:10px;padding:10px 16px;background:rgba(239,68,68,.07);border-bottom:1px solid rgba(239,68,68,.18);font-size:13px;color:#f87171;flex-shrink:0}
.missed-banner svg{width:16px;height:16px;flex-shrink:0}
.missed-banner.show{display:flex}
.mb-close{margin-left:auto;background:none;border:none;color:#f87171;cursor:pointer;font-size:20px;line-height:1;padding:0 2px}

/* Idle screen */
.idle{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;padding:24px;animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.idle img{height:64px;opacity:.65}
.idle-title{font-size:22px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.idle-sub{font-size:13px;color:var(--sub);text-align:center;line-height:1.7;max-width:280px}

/* ── CHAT ── */
.chat{display:none;flex-direction:column;flex:1;overflow:hidden}
.chat-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
.chat-av{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.chat-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.chat-info{flex:1;min-width:0}
.chat-name{font-size:14px;font-weight:600}
.chat-stat{font-size:11px;color:var(--sub)}
.chat-hbtns{display:flex;gap:6px}
.chb{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);display:grid;place-items:center;color:var(--sub);cursor:pointer;transition:all .15s}
.chb svg{width:16px;height:16px}
.chb:hover{border-color:var(--border2);color:var(--text)}
.chb.voice:hover{background:rgba(0,201,167,.08);color:var(--teal);border-color:rgba(0,201,167,.3)}
.chb.video:hover{background:rgba(41,121,255,.08);color:var(--blue);border-color:rgba(41,121,255,.3)}
/* Messages */
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.msgs::-webkit-scrollbar{width:3px}
.msgs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.mg{display:flex;flex-direction:column;max-width:74%}
.mg.me{align-self:flex-end;align-items:flex-end}
.mg.them{align-self:flex-start;align-items:flex-start}
.mb{padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.55;word-break:break-word}
.mg.me .mb{background:var(--msg-me);color:#fff;border-bottom-right-radius:4px}
.mg.them .mb{background:var(--msg-them);color:var(--text);border:1px solid var(--msg-them-border);border-bottom-left-radius:4px}
.mt{font-size:10px;color:var(--sub);margin-top:3px;padding:0 4px}
/* Input */
.chat-inp-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;align-items:flex-end}
.chat-inp{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:10px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:border .2s;resize:none;max-height:120px;line-height:1.4;overflow-y:auto}
.chat-inp:focus{border-color:var(--blue)}
.chat-inp::placeholder{color:var(--sub)}
.send-btn{width:40px;height:40px;border-radius:50%;background:var(--grad);border:none;color:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:all .15s}
.send-btn svg{width:16px;height:16px}
.send-btn:hover{transform:scale(1.08);box-shadow:0 4px 14px rgba(41,121,255,.4)}

/* ── CALL OVERLAY ── */
.call-ov{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(18px);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;animation:fi .3s ease}
.call-vids{position:relative;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 24px 64px rgba(0,0,0,.7);flex-shrink:0;display:none}
.vid-remote{width:min(420px,90vw);height:min(310px,52vh);object-fit:cover;display:block}
.vid-local{position:absolute;bottom:12px;right:12px;width:92px;height:124px;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.2)}
.call-av-big{width:88px;height:88px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff;position:relative;overflow:hidden;flex-shrink:0}
.call-av-big img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cr{position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(0,201,167,.2);animation:ring 1.6s ease-out infinite}
.cr:nth-child(2){inset:-18px;animation-delay:.6s;border-color:rgba(41,121,255,.15)}
@keyframes ring{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
.call-info{text-align:center}
.call-name{font-size:22px;font-weight:700;margin-bottom:5px}
.call-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:rgba(0,201,167,.1);color:var(--teal);border:1px solid rgba(0,201,167,.22);margin-bottom:6px}
.call-badge svg{width:13px;height:13px}
.call-status{font-size:13px;color:rgba(255,255,255,.45)}
.call-timer{font-size:28px;font-weight:700;color:var(--teal);letter-spacing:2px;font-variant-numeric:tabular-nums;display:none}
.call-ctrls{display:flex;gap:13px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:6px}
.cc{width:54px;height:54px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer;transition:all .2s;flex-shrink:0}
.cc svg{width:22px;height:22px}
.cc:hover{transform:scale(1.08)}
.cc-mute{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15)!important}
.cc-mute.on{background:rgba(239,68,68,.18);color:var(--danger);border-color:rgba(239,68,68,.35)!important}
.cc-cam{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15)!important;display:none}
.cc-cam.on{background:rgba(239,68,68,.18);color:var(--danger);border-color:rgba(239,68,68,.35)!important}
.cc-spk{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15)!important}
.cc-spk.on{background:rgba(245,158,11,.15);color:var(--warn);border-color:rgba(245,158,11,.3)!important}
.cc-end{background:var(--danger);color:#fff;width:62px;height:62px;box-shadow:0 8px 24px rgba(239,68,68,.45)}
.cc-end:hover{background:#dc2626}

/* ── INCOMING CALL ── */
.inc-ov{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;z-index:110;padding:20px}
.inc-card{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:40px 32px;text-align:center;box-shadow:0 40px 100px rgba(0,0,0,.8);width:min(320px,100%);animation:pop .3s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.inc-av{width:72px;height:72px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:26px;font-weight:700;color:#fff;margin:0 auto 14px;animation:glow 1.4s ease-in-out infinite;overflow:hidden}
.inc-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(0,201,167,.4)}50%{box-shadow:0 0 0 14px rgba(0,201,167,0)}}
.inc-label{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--sub);text-transform:uppercase;margin-bottom:4px}
.inc-name{font-size:20px;font-weight:700;margin-bottom:6px}
.inc-type{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:24px}
.inc-type svg{width:14px;height:14px}
.inc-btns{display:flex;gap:16px;justify-content:center}
.inc-btn{width:58px;height:58px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer;transition:all .2s}
.inc-btn svg{width:23px;height:23px}
.inc-btn:hover{transform:scale(1.1)}
.inc-dec{background:var(--danger);color:#fff;box-shadow:0 6px 20px rgba(239,68,68,.4)}
.inc-acc{background:var(--teal);color:#fff;box-shadow:0 6px 20px rgba(0,201,167,.4)}

/* ── PROFILE MODAL ── */
.modal-ov{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(8px);z-index:120;display:none;align-items:center;justify-content:center;padding:20px}
.modal-ov.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:22px;width:min(380px,100%);padding:28px 24px;box-shadow:var(--sh);animation:pop .3s cubic-bezier(.22,1,.36,1)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:3px}
.modal-sub{font-size:12px;color:var(--sub);margin-bottom:22px}
.mf{margin-bottom:14px}
.ml{display:block;font-size:11px;font-weight:600;letter-spacing:.7px;color:var(--sub);text-transform:uppercase;margin-bottom:7px}
.mi{width:100%;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:border .2s}
.mi:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(41,121,255,.12)}
.mi::placeholder{color:var(--sub)}
.mi-pfx{position:relative}
.mi-pfx-char{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-weight:600;color:var(--sub);font-size:15px;pointer-events:none}
.mi-pfx .mi{padding-left:28px}
.m-un-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;margin-top:5px}
.m-un-ok{background:rgba(0,201,167,.1);color:var(--teal);border:1px solid rgba(0,201,167,.25)}
.m-un-no{background:rgba(239,68,68,.08);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
.m-un-ld{background:var(--input);color:var(--sub);border:1px solid var(--border)}
.m-acts{display:flex;gap:8px;margin-top:4px}
.m-btn{flex:1;padding:11px;border-radius:10px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.m-btn-p{background:var(--grad);color:#fff}
.m-btn-p:hover{opacity:.9}
.m-btn-p:disabled{opacity:.5;cursor:not-allowed}
.m-btn-c{background:var(--panel2);color:var(--sub);border:1px solid var(--border)!important}
.m-btn-c:hover{color:var(--text)}
/* Avatar upload */
.av-upload{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.av-preview{width:64px;height:64px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;border:2px solid var(--border)}
.av-preview img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av-upload-btn{flex:1;padding:9px 14px;background:var(--input);border:1px solid var(--border);border-radius:10px;color:var(--sub);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;text-align:center}
.av-upload-btn:hover{border-color:var(--blue);color:var(--text)}

/* ── CONTEXT MENU ── */
.ctx{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px;z-index:200;min-width:170px;display:none;box-shadow:var(--sh)}
.ctx-item{padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--text);transition:background .15s}
.ctx-item svg{width:15px;height:15px;color:var(--sub)}
.ctx-item:hover{background:var(--panel2)}
.ctx-item:hover svg{color:var(--text)}
.ctx-sep{height:1px;background:var(--border);margin:4px 0}
.ctx-item.danger{color:var(--danger)}
.ctx-item.danger svg{color:var(--danger)}
.ctx-item.danger:hover{background:rgba(239,68,68,.07)}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:11px 16px;border-radius:12px;font-size:13px;font-weight:500;z-index:300;box-shadow:var(--sh);animation:tup .25s ease;max-width:300px;display:flex;align-items:center;gap:8px}
.toast svg{width:16px;height:16px;flex-shrink:0}
@keyframes tup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast.ok{border-color:rgba(0,201,167,.3);color:var(--teal)}
.toast.err{border-color:rgba(239,68,68,.3);color:#f87171}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .tb-menu{display:grid}
  .tb-user-name{display:none}
  .sidebar{position:fixed;top:54px;left:0;bottom:0;transform:translateX(-100%);box-shadow:var(--sh)}
  .sidebar.open{transform:translateX(0)}
  .call-ctrls{gap:10px}
  .cc{width:48px;height:48px}
  .cc svg{width:19px;height:19px}
  .cc-end{width:56px;height:56px}
}

audio{display:none}
</style>
</head>

<script>
// ─────────────────────────────────────────────────────
// AUTH
// ─────────────────────────────────────────────────────
const TOKEN = localStorage.getItem("pna-token");
let   USER  = JSON.parse(localStorage.getItem("pna-user") || "null");
if (!TOKEN || !USER) { location.href = "/"; }

// Show user info in topbar
document.getElementById("uid-txt").textContent  = USER.uniqueId || "—";
document.getElementById("tb-uname").textContent = USER.displayName || "@" + (USER.username || "");

// Theme
const TH = localStorage.getItem("pna-theme") || "dark";
document.documentElement.setAttribute("data-theme", TH); setThIcon(TH);
function toggleTheme() {
  const n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", n);
  localStorage.setItem("pna-theme", n); setThIcon(n);
}
function setThIcon(t) {
  document.getElementById("th-ic").innerHTML = t === "dark"
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
}

function logout() { localStorage.removeItem("pna-token"); localStorage.removeItem("pna-user"); location.href = "/"; }
function copyUID() {
  if (!USER.uniqueId) return;
  navigator.clipboard?.writeText(USER.uniqueId).then(() => toast("ID copied: " + USER.uniqueId, "ok")).catch(() => {});
}
function devId() {
  let id = localStorage.getItem("pna-dev");
  if (!id) { id = "d-" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("pna-dev", id); }
  return id;
}

// ─────────────────────────────────────────────────────
// API
// ─────────────────────────────────────────────────────
async function api(url, opts = {}) {
  const r = await fetch(url, {
    ...opts,
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + TOKEN, ...(opts.headers || {}) },
  });
  return r.json();
}

// ─────────────────────────────────────────────────────
// LOAD DATA
// ─────────────────────────────────────────────────────
async function loadAll() {
  const [fr, rq, bl] = await Promise.all([
    api("/api/friends"), api("/api/requests"), api("/api/blocked"),
  ]);
  friends = fr || []; requests = rq || []; blocked = bl || [];
  unread  = await api("/api/unread") || {};
  renderBadge(); renderTab();
}
loadAll();

async function loadHistory() {
  callHistory = await api("/api/call-history") || [];
  renderHistory();
}

async function refreshICE() {
  if (Date.now() / 1000 < iceExpiry - 300) return;
  try {
    const d = await api("/api/turn-credentials");
    ICE_CONFIG = { iceServers: d.iceServers }; iceExpiry = d.expiresAt || 0;
  } catch (_) {}
}

// SOCKET
// ─────────────────────────────────────────────────────
const socket = io({ auth: { token: TOKEN }, query: { deviceId: devId() } });

socket.on("connect_error", () => toast("Connection lost — retrying…", "err"));
socket.on("connect",       () => { /* reconnected — re-sync */ });

socket.on("status-sync", (map) => {
  Object.assign(onlineMap, map);
  if (curTab === "fr") renderFriends();
  if (chatPeer && map[chatPeer] !== undefined)
    document.getElementById("chat-stat").textContent = map[chatPeer] ? "● Online" : "● Offline";
});

socket.on("friend-status", ({ email, online }) => {
  onlineMap[email] = online;
  if (curTab === "fr") renderFriends();
  if (chatPeer === email)
    document.getElementById("chat-stat").textContent = online ? "● Online" : "● Offline";
});

socket.on("friend-request", () => { toast("You have a new friend request!", "ok"); loadAll(); });
socket.on("friend-accepted", ({ by }) => { toast("@" + by + " accepted your friend request!", "ok"); loadAll(); });

socket.on("new-message", (msg) => {
  if (chatPeer === msg.from) { appendMsg(msg, false); scrollMsgs(); api("/api/messages/" + msg.from); }
  else { unread[msg.from] = (unread[msg.from] || 0) + 1; if (curTab === "fr") renderFriends(); notify("New message", resolveDisplay(msg.from) + " sent you a message", "msg"); }
});
socket.on("message-sent", (msg) => { appendMsg(msg, true); scrollMsgs(); });

socket.on("force-disconnect", () => { toast("You were disconnected."); hangupClean(); loadAll(); });

// Heartbeat
setInterval(() => { if (socket.connected) socket.emit("hb"); }, 30000);

  if (u && u.avatar)

  const ch = (u?.displayName || u?.username || "?")[0].toUpperCase();

async function doSearch(q) {
  const res = await api("/api/search?q=" + encodeURIComponent(q));
  const el  = document.getElementById("srch-res");
  if (!res || !res.length) { el.innerHTML = '<div style="padding:10px 14px;font-size:12px;color:var(--sub)">No users found.</div>'; el.style.display = "block"; return; }
  el.innerHTML = res.map(u => {
    let btn = "";
    if (u.status === "accepted") btn = `<span class="sr-btn sr-fri">Friends</span>`;
    else if (u.status === "pending" && u.isRequester) btn = `<span class="sr-btn sr-pend">Pending</span>`;
    else btn = `<button class="sr-btn sr-add" onclick="sendFriendReq('${u.username}',this)">Add</button>`;
    return `<div class="sr-row">${avHTML(u,"sm")}<div class="sr-info"><div class="sr-name">${esc(u.displayName||"@"+u.username)}</div><div class="sr-un">@${u.username} · ${u.uniqueId}</div></div>${btn}</div>`;
  }).join("");
  el.style.display = "block";
}

function showCtx(e, email) {
  e.preventDefault(); e.stopPropagation(); ctxTarget = email;
  const m = document.getElementById("ctx");
  m.style.display = "block";
  m.style.left = Math.min(e.clientX, innerWidth  - 180) + "px";
  m.style.top  = Math.min(e.clientY, innerHeight - 170) + "px";
}
function hideCtx() { document.getElementById("ctx").style.display = "none"; }
document.addEventListener("click", hideCtx);
async function ctxAction(act) {
  hideCtx(); if (!ctxTarget) return;
  if (act === "msg")   { openChat(ctxTarget); return; }
  if (act === "voice") { callPeer(ctxTarget, "voice"); return; }
  if (act === "video") { callPeer(ctxTarget, "video"); return; }
  if (act === "block") {
    const f = friends.find(x => x.email === ctxTarget);
    if (!confirm("Block " + (f ? f.displayName || "@" + f.username : ctxTarget) + "?")) return;
    await api("/api/block/" + (f?.username || ctxTarget), { method: "POST" });
    toast("User blocked.", "err"); loadAll(); if (chatPeer === ctxTarget) closeChat();
  }
}

async function openChat(email) {
  chatPeer = email; closeSB();

  setAvEl(document.getElementById("chat-av"), f);
  document.getElementById("chat-name").textContent = f ? (f.displayName || "@" + f.username) : email;
  document.getElementById("chat-stat").textContent = onlineMap[email] ? "● Online" : "● Offline";
  document.getElementById("idle").style.display = "none";
  document.getElementById("chat").style.display = "flex";
  delete unread[email]; renderFriends();
  const msgs = await api("/api/messages/" + email);
  const el = document.getElementById("msgs"); el.innerHTML = "";
  (msgs || []).forEach(m => appendMsg(m, m.from === USER.uniqueId || m.from === chatPeer ? false : true));
  // Actually check from vs my email (email stored in token)
  el.innerHTML = ""; (msgs || []).forEach(m => appendMsg(m, m.to === email));
  scrollMsgs();
}
function closeChat() {
  chatPeer = null;
  document.getElementById("chat").style.display = "none";

// ─────────────────────────────────────────────────────
// WEB AUDIO RING
// ─────────────────────────────────────────────────────
let _ac = null, _rnodes = [], _rint = null;
function getAC() {
  if (!_ac || _ac.state === "closed") _ac = new (window.AudioContext || window.webkitAudioContext)();
  if (_ac.state === "suspended") _ac.resume();
  return _ac;
}
function playRing(type) {
  stopRing();
  const go = () => {
    try {
      const ctx = getAC();
      (type === "in" ? [480, 620] : [520, 640]).forEach((freq, i) => {
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.value = freq; osc.type = "sine";
        const t = ctx.currentTime + (type === "in" ? 0 : i * 0.18);
        const vol = type === "in" ? 0.16 : 0.09;
        const dur = type === "in" ? 0.45 : 0.22;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.06);
        g.gain.setValueAtTime(vol, t + dur - 0.06);
        g.gain.linearRampToValueAtTime(0, t + dur);
        osc.start(t); osc.stop(t + dur + 0.05);
        _rnodes.push(osc);
      });
    } catch (_) {}
  };
  go(); _rint = setInterval(go, type === "in" ? 3200 : 2200);
}
function stopRing() {
  clearInterval(_rint); _rint = null;
  _rnodes.forEach(n => { try { n.stop(); } catch (_) {} }); _rnodes = [];
}
function playConnectSound() {
  try {
    const ctx = getAC();
    [800, 1000].forEach((freq, i) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.frequency.value = freq; osc.type = "sine";
      const t = ctx.currentTime + i * 0.13;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.1, t + 0.05);
      g.gain.linearRampToValueAtTime(0, t + 0.18); osc.start(t); osc.stop(t + 0.22);
    });
  } catch (_) {}
}

// ─────────────────────────────────────────────────────
// WEBRTC
// ─────────────────────────────────────────────────────
// Limit SDP bandwidth — reduces data usage during calls
function limitBandwidth(sdp, kbps) {
  // Add b=AS: line to each m= section
  return sdp.replace(/^(m=.*
?
(?:.*
?
)*?)(?=m=|$)/gm, (match) => {
    if (!match.includes("b=AS:")) {
      return match.replace(/^(c=.*
?
)/m, "$1b=AS:" + kbps + "
");
    }
    return match;
  });
}

function mkPC(target) {
  const p = new RTCPeerConnection(ICE_CONFIG);
  p.onicecandidate = e => {
    if (e.candidate) socket.emit("ice-candidate", { targetEmail: target, candidate: e.candidate });
  };
  p.ontrack = e => {
    const rv = document.getElementById("vid-remote");
    const ra = document.getElementById("ra");
    if (e.streams[0].getVideoTracks().length) {
      rv.srcObject = e.streams[0];
      document.getElementById("call-vids").style.display = "block";
      document.getElementById("call-av-big").style.display = "none";
    } else {
      ra.srcObject = e.streams[0];
    }
  };
  p.onconnectionstatechange = () => {
    const s = p.connectionState;
    if (s === "connected") { callState = CALL_STATE.CONNECTED; stopRing(); playConnectSound(); setCallStatus("Connected"); startTimer(); document.getElementById("call-timer").style.display = "block"; }
    else if (["disconnected","failed","closed"].includes(s) && isInCall()) { endCall(); }
  };
  return p;
}

async function getMedia(video) {
  // Optimized constraints — saves data without sacrificing quality for voice/video calls
  const audioConstraints = {
    echoCancellation: true,
    noiseSuppression: true,
    autoGainControl:  true,
    sampleRate:       16000,  // 16kHz saves ~40% bandwidth vs 48kHz for voice
    channelCount:     1,      // mono — fine for calls
  };
  const videoConstraints = video ? {
    facingMode: "user",
    width:      { ideal: 640, max: 854 },
    height:     { ideal: 480, max: 480 },
    frameRate:  { ideal: 20,  max: 24 },  // 20fps is enough, saves data vs 30fps
  } : false;
  return navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: videoConstraints });
}

// ─────────────────────────────────────────────────────
// CALL — State machine approach (prevents ghost state)
// ─────────────────────────────────────────────────────

// Single source of truth — only ONE of these states active
const CALL_STATE = { IDLE: 0, CALLING: 1, RINGING: 2, CONNECTED: 3 };
let callState = CALL_STATE.IDLE;

function isInCall() { return callState !== CALL_STATE.IDLE; }

// Outgoing call
async function callPeer(targetEmail, type = "voice") {
  if (isInCall()) { toast("Already in a call.", "err"); return; }
  // Set state immediately, atomically
  callState = CALL_STATE.CALLING;
  curPeer = targetEmail; curCallType = type; callActive = true;
  showCallOv(targetEmail, type, "Calling\u2026"); closeSB();
  try {
    await refreshICE();
    localStream = await getMedia(type === "video");
    if (type === "video") {
      document.getElementById("vid-local").srcObject = localStream;
      document.getElementById("cc-cam").style.display = "grid";
    }
    pc = mkPC(targetEmail);
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    const offer = await pc.createOffer();
    // Apply bandwidth cap to SDP — reduces data usage significantly
    const sdp = limitBandwidth(offer.sdp, type === "video" ? 500 : 40);
    const cappedOffer = new RTCSessionDescription({ type: offer.type, sdp });
    await pc.setLocalDescription(cappedOffer);
    socket.emit("call-user", { targetEmail, offer: cappedOffer, callType: type });
    playRing("out");
  } catch (err) {
    console.error("[Call]", err);
    toast("Camera/microphone access denied.", "err");
    hangupClean();
  }
}

socket.on("call-session",   ({ sessionId: sid }) => { sessionId = sid; });
socket.on("call-failed",    ({ reason }) => { stopRing(); toast(reason, "err"); hangupClean(); });
socket.on("call-rejected",  () => { stopRing(); toast("Call was declined.", "err"); hangupClean(); });
socket.on("call-answered", async ({ answer }) => {
  stopRing(); callState = CALL_STATE.CONNECTED;
  if (pc) {
    try {
      await pc.setRemoteDescription(new RTCSessionDescription(answer));
      setCallStatus("Connecting…");
    } catch(e) { console.error("[call-answered]", e); hangupClean(); }
  }
});
socket.on("call-ended",     ({ reason } = {}) => { stopRing(); if (isInCall()) toast(reason || "Call ended."); hangupClean(); });
socket.on("ice-candidate", async ({ candidate }) => {
  if (pc && candidate) {
    try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(_) {}
  }
});
socket.on("call-cancelled", () => { stopRing(); toast("Caller cancelled the call."); hangupClean(); });
socket.on("call-auto-ended",() => { stopRing(); toast("Missed call \u2014 no answer."); hangupClean(); });

// Incoming call
socket.on("incoming-call", ({ from, fromName, offer, callType: ct, sessionId: sid }) => {
  if (isInCall()) {
    // Already in call — auto-reject
    socket.emit("call-reject", { targetEmail: from, sessionId: sid });
    return;
  }
  incFrom = from; incOffer = offer; incSessionId = sid; incCallType = ct || "voice";
  callState = CALL_STATE.RINGING;
  const f = friends.find(x => x.email === from);
  const nm = f ? (f.displayName || "@" + f.username) : (fromName || from);
  const incAvEl = document.getElementById("inc-av");
  setAvEl(incAvEl, f);
  document.getElementById("inc-name").textContent = nm;
  document.getElementById("inc-type-txt").textContent = ct === "video" ? "Video Call" : "Voice Call";
  document.getElementById("inc-ov").style.display = "flex";
  playRing("in");
  if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]);
  notify("Incoming " + (ct === "video" ? "video" : "voice") + " call", nm + " is calling you\u2026", "call");
});

async function acceptCall() {
  if (!incOffer) return;
  stopRing(); if (navigator.vibrate) navigator.vibrate(0);
  document.getElementById("inc-ov").style.display = "none";
  curPeer = incFrom; curCallType = incCallType; sessionId = incSessionId;
  callState = CALL_STATE.CALLING; callActive = true;
  showCallOv(incFrom, incCallType, "Connecting\u2026"); closeSB();
  try {
    await refreshICE();
    localStream = await getMedia(incCallType === "video");
    if (incCallType === "video") {
      document.getElementById("vid-local").srcObject = localStream;
      document.getElementById("cc-cam").style.display = "grid";
    }
    pc = mkPC(incFrom);
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    await pc.setRemoteDescription(new RTCSessionDescription(incOffer));
    const answer = await pc.createAnswer();
    const sdpA = limitBandwidth(answer.sdp, incCallType === "video" ? 500 : 40);
    const cappedAnswer = new RTCSessionDescription({ type: answer.type, sdp: sdpA });
    await pc.setLocalDescription(cappedAnswer);
    socket.emit("call-answer", { targetEmail: incFrom, answer: cappedAnswer, sessionId: incSessionId });
  } catch (err) {
    console.error("[Accept]", err);
    toast("Camera/microphone access denied.", "err");
    hangupClean();
  }
}

function rejectCall() {
  stopRing(); if (navigator.vibrate) navigator.vibrate(0);
  if (incFrom) socket.emit("call-reject", { targetEmail: incFrom, sessionId: incSessionId });
  hangupClean();
}

// Controls
function toggleMute() {
  isMuted = !isMuted;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  const b = document.getElementById("cc-mute"); b.className = "cc cc-mute" + (isMuted ? " on" : "");
  b.innerHTML = isMuted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
}
function toggleCam() {
  isCamOff = !isCamOff;
  if (localStream) localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
  const b = document.getElementById("cc-cam"); b.className = "cc cc-cam" + (isCamOff ? " on" : "");
  b.innerHTML = isCamOff
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>';
}
function toggleSpk() {
  isSpeakerMuted = !isSpeakerMuted;
  document.getElementById("ra").muted = isSpeakerMuted;
  const b = document.getElementById("cc-spk"); b.className = "cc cc-spk" + (isSpeakerMuted ? " on" : "");
  b.innerHTML = isSpeakerMuted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
}

function endCall() {
  const peer = curPeer; const dur = timerSecs; const sid = sessionId;
  hangupClean(); // reset state first
  if (peer) socket.emit("call-end", { targetEmail: peer, duration: dur, sessionId: sid });
  setTimeout(loadAll, 800);
}

function hangupClean() {
  // Reset ALL state atomically — this is the single cleanup function
  callState = CALL_STATE.IDLE;
  curPeer = null; callActive = false; sessionId = null;
  incFrom = null; incOffer = null; incSessionId = null;
  stopRing(); if (navigator.vibrate) navigator.vibrate(0);
  if (pc) { try { pc.close(); } catch (_) {} pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => { try { t.stop(); } catch (_) {} }); localStream = null; }
  stopTimer();
  try { document.getElementById("ra").srcObject = null; } catch (_) {}
  const rv = document.getElementById("vid-remote"); try { rv.srcObject = null; } catch (_) {}
  const lv = document.getElementById("vid-local");  try { lv.srcObject = null; } catch (_) {}
  document.getElementById("call-vids").style.display = "none";
  document.getElementById("call-av-big").style.display = "grid";
  document.getElementById("call-ov").style.display = "none";
  document.getElementById("inc-ov").style.display = "none";
  document.getElementById("cc-cam").style.display = "none";
  document.getElementById("cc-mute").className = "cc cc-mute";
  document.getElementById("cc-cam").className = "cc cc-cam";
  document.getElementById("cc-spk").className = "cc cc-spk";
  isMuted = false; isCamOff = false; isSpeakerMuted = false;
  // Restore mute icon
  document.getElementById("cc-mute").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
}

function startTimer() {
  timerSecs = 0; clearInterval(timerInt);
  const el = document.getElementById("call-timer");
  timerInt = setInterval(() => {
    timerSecs++;
    const m = String(Math.floor(timerSecs / 60)).padStart(2,"0");
    const s = String(timerSecs % 60).padStart(2,"0");
    el.textContent = m + ":" + s;
  }, 1000);
}
function stopTimer() { clearInterval(timerInt); timerSecs = 0; document.getElementById("call-timer").textContent = "00:00"; document.getElementById("call-timer").style.display = "none"; }

function showCallOv(email, type, status) {
  const f = friends.find(x => x.email === email);
  const nm = f ? (f.displayName || "@" + f.username) : email;
  setAvEl(document.getElementById("call-av-big"), f);
  document.getElementById("call-av-char").textContent = (nm[0] || "?").toUpperCase();
  document.getElementById("call-name").textContent = nm;
  document.getElementById("call-badge-txt").textContent = type === "video" ? "Video Call" : "Voice Call";
  document.getElementById("call-ov").style.display = "flex";
  setCallStatus(status);
}
function setCallStatus(s) { document.getElementById("call-status").textContent = s; }

// ─────────────────────────────────────────────────────
// PROFILE MODAL
// ─────────────────────────────────────────────────────
let _pUnOk = false, _pUnT = null;

function openProfile() {
  document.getElementById("p-dn").value  = USER.displayName || "";
  document.getElementById("p-un").value  = USER.username || "";
  document.getElementById("p-uid").value = USER.uniqueId  || "";
  const prevEl = document.getElementById("av-preview");
  setAvEl(prevEl, USER);
  // If username already set, lock the field
  const unField = document.getElementById("p-un");
  if (USER.usernameSet) { unField.readOnly = true; unField.style.opacity = ".6"; unField.style.cursor = "default"; }
  const st = document.getElementById("p-un-st"); st.style.display = "none";
  document.getElementById("profile-modal").classList.add("show");
}
function closeProfile() { document.getElementById("profile-modal").classList.remove("show"); }
document.getElementById("profile-modal").addEventListener("click", e => { if (e.target === document.getElementById("profile-modal")) closeProfile(); });

function chkPUN() {
  if (USER.usernameSet) return;
  const v   = document.getElementById("p-un").value.trim();
  const st  = document.getElementById("p-un-st");
  _pUnOk = false; st.style.display = "inline-block";
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(v)) { st.textContent = "3–20 chars, letters/numbers/_"; st.className = "m-un-badge m-un-no"; return; }
  st.textContent = "Checking…"; st.className = "m-un-badge m-un-ld";
  clearTimeout(_pUnT);
  _pUnT = setTimeout(async () => {
    const d = await api("/api/check-username?q=" + encodeURIComponent(v));
    if (d.available) { st.textContent = "✓ Available"; st.className = "m-un-badge m-un-ok"; _pUnOk = true; }
    else { st.textContent = "✗ " + (d.reason || "Taken"); st.className = "m-un-badge m-un-no"; }
  }, 420);
}

async function saveProfile() {
  const dn = document.getElementById("p-dn").value.trim();
  const un = document.getElementById("p-un").value.trim();
  const btn = document.getElementById("btn-save-p"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    let changed = false;
    if (dn && dn !== USER.displayName) {
      const d = await api("/api/display-name", { method: "PUT", body: JSON.stringify({ displayName: dn }) });
      if (d.error) { toast(d.error, "err"); return; }
      USER.displayName = dn;
      if (d.token) localStorage.setItem("pna-token", d.token);
      changed = true;
    }
    if (!USER.usernameSet && un && _pUnOk) {
      const d = await api("/api/username", { method: "PUT", body: JSON.stringify({ username: un }) });
      if (d.error) { toast(d.error, "err"); return; }
      USER.username = un; USER.usernameSet = true;
      if (d.token) localStorage.setItem("pna-token", d.token);
      changed = true;
    }
    if (changed) {
      localStorage.setItem("pna-user", JSON.stringify(USER));
      document.getElementById("tb-uname").textContent = USER.displayName || "@" + USER.username;
      toast("Profile updated!", "ok");
    }
    closeProfile();
  } catch (err) { toast("Failed to save.", "err"); }
  finally { btn.disabled = false; btn.textContent = "Save Changes"; }
}

function onAvatarFile(e) {
  const file = e.target.files[0]; if (!file) return;
  if (file.size > 200000) { toast("Image too large. Max 150KB.", "err"); return; }
  const reader = new FileReader();
  reader.onload = async ev => {
    const data = ev.target.result;
    setAvEl(document.getElementById("av-preview"), { avatar: data });
    const d = await api("/api/avatar", { method: "PUT", body: JSON.stringify({ avatarData: data }) });
    if (d.error) { toast(d.error, "err"); return; }
    USER.avatar = data; localStorage.setItem("pna-user", JSON.stringify(USER));
    toast("Profile picture updated!", "ok");
  };
  reader.readAsDataURL(file);
}

// ─────────────────────────────────────────────────────
// NOTIFICATIONS + PUSH
// ─────────────────────────────────────────────────────
async function initNotifications() {
  if (!("Notification" in window)) return;
  if (Notification.permission === "default") await Notification.requestPermission();
  // Register push subscription
  if ("serviceWorker" in navigator && Notification.permission === "granted") {
    try {
      const { key } = await api("/api/vapid-key");
      if (!key) return;
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: b64ToUint8(key),
        });
      }
      await api("/api/push-subscribe", { method: "POST", body: JSON.stringify({ subscription: sub }) });
    } catch (err) { console.log("[Push] setup failed:", err.message); }
  }
}
function b64ToUint8(b64) {
  const pad = "=".repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
function notify(title, body, tag) {
  if (document.hasFocus()) return;
  if (Notification.permission !== "granted") return;
  try { const n = new Notification(title, { body, icon: "/logo.png", tag }); n.onclick = () => { window.focus(); n.close(); }; setTimeout(() => n.close(), 8000); } catch (_) {}
}

// Missed calls check
async function checkMissed() {
  const missed = await api("/api/missed-calls");
  if (!missed || !missed.length) return;
  const el = document.getElementById("missed-banner");
  document.getElementById("missed-txt").textContent = missed.length === 1
    ? "Missed call from " + (missed[0].caller.displayName || "@" + missed[0].caller.username)
    : missed.length + " missed calls while you were away.";
  el.classList.add("show");
  notify("Missed Call" + (missed.length > 1 ? "s" : ""), document.getElementById("missed-txt").textContent, "missed");
}

// Service worker
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

// Startup sequence
setTimeout(() => { initNotifications(); checkMissed(); }, 1000);

// ─────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br/>"); }
function fmtTime(iso) {
  const d = new Date(iso), now = new Date(), diff = now - d;
  if (diff < 60000) return "just now";
  if (diff < 3600000) return Math.floor(diff/60000) + "m ago";
  if (diff < 86400000) return Math.floor(diff/3600000) + "h ago";
  return d.toLocaleDateString();
}
function fmtDur(s) { const m = Math.floor(s / 60); return m > 0 ? m + "m " + (s % 60) + "s" : s + "s"; }

let _tt;
function toast(msg, t = "") {
  const old = document.querySelector(".toast"); if (old) old.remove();
  const d = document.createElement("div"); d.className = "toast" + (t ? " " + t : ""); d.textContent = msg;
  document.body.appendChild(d); clearTimeout(_tt); _tt = setTimeout(() => d.remove(), 3200);
}
</script>
