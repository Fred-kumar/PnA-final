<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>P&A Connect — Complete Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root[data-theme="dark"]{--bg:#07101f;--card:#0d1a2e;--border:#1c2e46;--text:#e8f0fe;--sub:#7a90b0;--input:#111f33;--blue:#2979ff;--teal:#00c9a7;--danger:#ef4444;--grad:linear-gradient(135deg,#2979ff,#00c9a7)}
:root[data-theme="light"]{--bg:#f0f4f8;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--sub:#64748b;--input:#f8fafc;--blue:#2563eb;--teal:#0d9488;--danger:#ef4444;--grad:linear-gradient(135deg,#2563eb,#0d9488)}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px;transition:background .25s}
.card{width:min(400px,100%);background:var(--card);border:1px solid var(--border);border-radius:22px;padding:40px 32px;box-shadow:0 24px 80px rgba(0,0,0,.4);animation:up .4s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.head{text-align:center;margin-bottom:28px}
.head img{height:48px;object-fit:contain}
.title{font-size:20px;font-weight:700;margin-top:10px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.field{margin-bottom:16px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.7px;color:var(--sub);text-transform:uppercase;margin-bottom:7px}
.pfx-wrap{position:relative}
.pfx{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;font-weight:600;color:var(--sub);pointer-events:none}
input{width:100%;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:border .2s,box-shadow .2s}
.pfx-wrap input{padding-left:30px}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(41,121,255,.12)}
input::placeholder{color:var(--sub)}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;margin-top:6px}
.b-ok{background:rgba(0,201,167,.1);color:var(--teal);border:1px solid rgba(0,201,167,.25)}
.b-no{background:rgba(239,68,68,.08);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
.b-ld{background:var(--input);color:var(--sub);border:1px solid var(--border)}
.btn{width:100%;padding:13px;background:var(--grad);border:none;border-radius:12px;color:#fff;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s;margin-top:4px}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(41,121,255,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.err{padding:10px 14px;border-radius:9px;font-size:13px;font-weight:500;margin-bottom:14px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#f87171;display:none}
.note{font-size:11px;color:var(--sub);margin-top:10px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <img src="/logo.png" alt="P&A Connect"/>
    <div class="title">One Last Step</div>
    <div class="sub">Choose a unique username to complete your profile. This is permanent and cannot be changed.</div>
  </div>
  <div class="err" id="err"></div>
  <div class="field">
    <label>Username</label>
    <div class="pfx-wrap"><span class="pfx">@</span><input type="text" id="un" placeholder="yourname" maxlength="20" oninput="chk()" autocomplete="off" spellcheck="false"/></div>
    <div id="un-st" class="badge b-ld" style="display:none"></div>
  </div>
  <div class="field">
    <label>Display Name <span style="font-size:10px;text-transform:none;font-weight:400">(shown to others)</span></label>
    <input type="text" id="dn" placeholder="Your full name" maxlength="40"/>
  </div>
  <button class="btn" id="btn" onclick="save()" disabled>Complete Setup →</button>
  <div class="note">Letters, numbers and underscore only · 3–20 characters</div>
</div>
<script>
const token = localStorage.getItem("pna-token");
const user  = JSON.parse(localStorage.getItem("pna-user") || "{}");
if (!token) location.href = "/";
if (user.usernameSet) location.href = "/app.html";
if (user.displayName) document.getElementById("dn").value = user.displayName;

const th = localStorage.getItem("pna-theme") || "dark";
document.documentElement.setAttribute("data-theme", th);

let _ok = false, _t = null;

function chk() {
  const v   = document.getElementById("un").value.trim();
  const st  = document.getElementById("un-st");
  const btn = document.getElementById("btn");
  _ok = false; btn.disabled = true; st.style.display = "inline-flex";
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(v)) {
    st.textContent = "3–20 chars, letters/numbers/underscore only"; st.className = "badge b-no"; return;
  }
  st.textContent = "Checking…"; st.className = "badge b-ld";
  clearTimeout(_t);
  _t = setTimeout(async () => {
    try {
      const d = await (await fetch("/api/check-username?q=" + encodeURIComponent(v), {
        headers: { Authorization: "Bearer " + token }
      })).json();
      if (d.available) { st.textContent = "✓ Available"; st.className = "badge b-ok"; _ok = true; btn.disabled = false; }
      else { st.textContent = "✗ " + (d.reason || "Taken"); st.className = "badge b-no"; }
    } catch { st.textContent = "Check failed"; st.className = "badge b-no"; }
  }, 400);
}

async function save() {
  if (!_ok) return;
  const username    = document.getElementById("un").value.trim();
  const displayName = document.getElementById("dn").value.trim() || username;
  const btn = document.getElementById("btn");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const r = await fetch("/api/username", {
      method: "PUT",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ username, displayName }),
    });
    const d = await r.json();
    if (!r.ok) { document.getElementById("err").textContent = d.error || "Failed"; document.getElementById("err").style.display = "block"; btn.disabled = false; btn.textContent = "Complete Setup →"; return; }
    localStorage.setItem("pna-token", d.token || token);
    localStorage.setItem("pna-user", JSON.stringify({ ...user, username, displayName, usernameSet: true }));
    location.href = "/app.html";
  } catch { document.getElementById("err").textContent = "Connection error."; document.getElementById("err").style.display = "block"; btn.disabled = false; btn.textContent = "Complete Setup →"; }
}
</script>
</body>
</html>
